name: Deploy ESP32 Education Editor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout ESP32 Education Editor source
        uses: actions/checkout@v6
        with:
          repository: davinichi/ESP32-Education-Editor
          ref: 63dc35b6cfe6adf5b6f5edb881d04ccc2f697b51 # Editor v1.0, PR #12
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build ESP32 Education Editor
        working-directory: source
        run: npm run build

      - name: Verify web build
        run: test -f source/packages/scratch-gui/build/index.html

      - name: Add firmware installer to web build
        run: |
          rm -rf source/packages/scratch-gui/build/firmware
          mkdir -p source/packages/scratch-gui/build/firmware
          cp -a site/firmware/. source/packages/scratch-gui/build/firmware/
          test -f source/packages/scratch-gui/build/firmware/index.html
          test -f source/packages/scratch-gui/build/firmware/manifest.json
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'source/packages/scratch-gui/build/firmware';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.version !== '1.0.0') throw Error('Unexpected firmware version');
          for (const build of manifest.builds) for (const part of build.parts) {
            const file = path.resolve(root, part.path);
            if (!file.startsWith(path.resolve(root) + path.sep) || !fs.statSync(file).isFile()) {
              throw Error('Invalid firmware path');
            }
          }
          NODE
          cp -a site/manuals source/packages/scratch-gui/build/manuals

      - name: Disable Jekyll processing
        run: touch source/packages/scratch-gui/build/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/packages/scratch-gui/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
