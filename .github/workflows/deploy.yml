name: Deploy ESP32 Education Editor to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v6
        with:
          path: site

      - name: Checkout ESP32 Education Editor source
        uses: actions/checkout@v6
        with:
          repository: davinichi/ESP32-Education-Editor
          ref: main
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build ESP32 Education Editor
        working-directory: source
        run: npm run build

      - name: Verify web build
        run: test -f source/packages/scratch-gui/build/index.html

      - name: Add firmware installer to web build
        run: |
          rm -rf source/packages/scratch-gui/build/firmware
          mkdir -p source/packages/scratch-gui/build/firmware
          cp -a site/firmware/. source/packages/scratch-gui/build/firmware/
          test -f source/packages/scratch-gui/build/firmware/index.html
          test -f source/packages/scratch-gui/build/firmware/manifest.json
          test -f source/packages/scratch-gui/build/firmware/firmware/esp32_education_editor_firmware_v0_1_5.ino.merged.bin

      - name: Disable Jekyll processing
        run: touch source/packages/scratch-gui/build/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/packages/scratch-gui/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
